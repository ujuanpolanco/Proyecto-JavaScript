<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Arial, Helvetica, sans-serif">
  
  <title>Wireframe 3 — Modal para importar tareas</title>
  <rect width="1200" height="800" fill="#9e9e9e"/>
  <text x="24" y="34" font-size="14" fill="#f5f5f5">Wireframe 3 · Modal de importar tareas (API jsonplaceholder)</text>

  <rect x="240" y="80" width="720" height="600" rx="16" fill="#fff"/>
  <text x="272" y="124" font-size="22" font-weight="bold" fill="#333">Importar tareas</text>
  <text x="272" y="148" font-size="13" fill="#777">Selecciona una o varias tareas del banco público. Las importadas solo se pueden eliminar.</text>
  <text x="922" y="124" font-size="20" fill="#777">✕</text>

  <rect x="272" y="168" width="480" height="40" rx="8" fill="#fff" stroke="#999"/><text x="286" y="193" font-size="14" fill="#aaa">Buscar en el banco…</text>
  <rect x="762" y="168" width="166" height="40" rx="8" fill="#fff" stroke="#999"/><text x="776" y="193" font-size="14" fill="#333">Todas ▾</text>

  <rect x="272" y="220" width="656" height="350" rx="8" fill="#fff" stroke="#ccc"/>
  <rect x="272" y="220" width="656" height="40" rx="8" fill="#eee"/>
  <g font-size="14" fill="#333">
    <rect x="286" y="232" width="16" height="16" fill="#555"/><text x="290" y="245" fill="#fff" font-size="12">–</text>
    <text x="312" y="245" font-weight="bold">Seleccionar visibles (200)</text>

    <rect x="273" y="261" width="654" height="56" fill="#e8e8e8"/>
    <rect x="286" y="280" width="16" height="16" fill="#555"/><text x="289" y="293" fill="#fff" font-size="12">✓</text>
    <text x="314" y="285">delectus aut autem</text><text x="314" y="303" font-size="11" fill="#777">#1 · Usuario 1</text>
    <rect x="836" y="279" width="76" height="18" rx="9" fill="#ddd"/><text x="844" y="292" font-size="11">Pendiente</text>

    <rect x="286" y="336" width="16" height="16" fill="#fff" stroke="#777"/>
    <text x="314" y="341">quis ut nam facilis et officia qui</text><text x="314" y="359" font-size="11" fill="#777">#2 · Usuario 1</text>
    <rect x="836" y="335" width="76" height="18" rx="9" fill="#ddd"/><text x="844" y="348" font-size="11">Pendiente</text>

    <rect x="286" y="392" width="16" height="16" fill="#bbb"/><text x="289" y="405" fill="#fff" font-size="12">✓</text>
    <text x="314" y="397" fill="#999">fugiat veniam minus</text><text x="314" y="415" font-size="11" fill="#999">#3 · Usuario 1</text>
    <rect x="820" y="391" width="92" height="18" rx="9" fill="#d0d0d0"/><text x="828" y="404" font-size="11">Ya importada</text>

    <rect x="286" y="448" width="16" height="16" fill="#fff" stroke="#777"/>
    <text x="314" y="453">et porro tempora</text><text x="314" y="471" font-size="11" fill="#777">#4 · Usuario 1</text>
    <rect x="828" y="447" width="84" height="18" rx="9" fill="#ddd"/><text x="836" y="460" font-size="11">Completada</text>
    <text x="580" y="540" font-size="13" fill="#999">⋮  (lista con scroll)</text>
  </g>

  <line x1="240" y1="596" x2="960" y2="596" stroke="#ddd"/>
  <g font-size="14">
    <text x="272" y="639" font-weight="bold" fill="#333">1 seleccionada</text>
    <rect x="690" y="614" width="100" height="40" rx="8" fill="#fff" stroke="#999"/><text x="710" y="639" fill="#333">Cancelar</text>
    <rect x="800" y="614" width="128" height="40" rx="8" fill="#555"/><text x="814" y="639" fill="#fff">↓ Importar (1)</text>
  </g>

  <g font-size="12" fill="#fff">
    <text x="240" y="716">① Estados: "Cargando…" (spinner) → lista; o error con mensaje claro y botón "Reintentar".</text>
    <text x="240" y="736">② Selección de una o varias; "Seleccionar visibles" respeta la búsqueda. Las ya importadas aparecen deshabilitadas.</text>
    <text x="240" y="756">③ Al importar se guardan con id TSK-A-###### junto a las tareas locales.</text>
  </g>
</svg>
