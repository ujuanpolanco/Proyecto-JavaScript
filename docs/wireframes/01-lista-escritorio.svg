<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Arial, Helvetica, sans-serif">
  <title>Wireframe 1 — Lista de tareas (escritorio)</title>
  <rect width="1200" height="820" fill="#f2f2f2"/>
  <text x="24" y="34" font-size="14" fill="#888">Wireframe 1 · Lista de tareas (vista inicial) · Escritorio</text>

  <!-- Encabezado -->
  <rect x="150" y="70" width="320" height="34" fill="#bdbdbd"/>
  <text x="160" y="94" font-size="22" font-weight="bold" fill="#333">Gestor de tareas</text>
  <rect x="150" y="114" width="300" height="12" fill="#d6d6d6"/>
  <text x="790" y="92" font-size="13" fill="#555">Progreso</text><text x="1020" y="92" font-size="13" fill="#555">29%</text>
  <rect x="790" y="102" width="260" height="10" rx="5" fill="#d6d6d6"/><rect x="790" y="102" width="76" height="10" rx="5" fill="#777"/>

  <!-- Barra de acciones -->
  <g font-size="14" fill="#333">
    <rect x="150" y="150" width="150" height="40" rx="8" fill="#555"/><text x="180" y="175" fill="#fff">+ Nueva tarea</text>
    <rect x="310" y="150" width="120" height="40" rx="8" fill="#fff" stroke="#999"/><text x="335" y="175">↓ Importar</text>
    <rect x="740" y="150" width="190" height="40" rx="8" fill="#fff" stroke="#999"/><text x="762" y="175">✓✓ Marcar terminadas</text>
    <rect x="940" y="150" width="110" height="40" rx="8" fill="#fff" stroke="#999"/><text x="958" y="175">🗑 Vaciar lista</text>
  </g>

  <!-- Buscador y filtro -->
  <rect x="150" y="204" width="500" height="44" rx="8" fill="#fff" stroke="#999"/>
  <text x="170" y="231" font-size="14" fill="#999">🔍  Buscar por título o ID…</text>
  <rect x="664" y="204" width="386" height="44" rx="8" fill="#e6e6e6" stroke="#ccc"/>
  <rect x="670" y="210" width="96" height="32" rx="6" fill="#fff"/>
  <g font-size="13" fill="#333"><text x="684" y="231">Todas (7)</text><text x="790" y="231">Pendientes (5)</text><text x="912" y="231">Completadas (2)</text></g>
  <text x="150" y="276" font-size="13" fill="#777">7 tareas · 5 pendientes</text>

  <!-- Tareas -->
  <g font-size="15" fill="#333">
    <rect x="150" y="292" width="900" height="76" rx="10" fill="#fff" stroke="#ccc"/>
    <circle cx="180" cy="330" r="11" fill="none" stroke="#999" stroke-width="2"/>
    <text x="206" y="324" font-weight="bold">Título de la tarea creada por el usuario</text>
    <rect x="206" y="336" width="70" height="18" rx="9" fill="#e0e0e0"/><text x="214" y="349" font-size="11">Pendiente</text>
    <text x="288" y="349" font-size="12" fill="#777">📅 4 nov 2026   TSK-L-000004</text>
    <text x="960" y="335">✎</text><text x="1006" y="335">🗑</text>

    <rect x="150" y="378" width="900" height="76" rx="10" fill="#f7f7f7" stroke="#ccc"/>
    <circle cx="180" cy="416" r="11" fill="#777"/><text x="174" y="421" fill="#fff" font-size="12">✓</text>
    <text x="206" y="410" font-weight="bold" fill="#888" text-decoration="line-through">Tarea completada</text>
    <rect x="206" y="422" width="80" height="18" rx="9" fill="#e0e0e0"/><text x="214" y="435" font-size="11">Completada</text>
    <text x="298" y="435" font-size="12" fill="#777">📅 3 nov 2026   TSK-L-000003</text>
    <text x="960" y="421">✎</text><text x="1006" y="421">🗑</text>

    <rect x="150" y="464" width="900" height="76" rx="10" fill="#fff" stroke="#ccc"/>
    <circle cx="180" cy="502" r="11" fill="#eee" stroke="#bbb" stroke-width="2"/>
    <text x="206" y="496" font-weight="bold">Tarea importada desde la API</text>
    <rect x="206" y="508" width="70" height="18" rx="9" fill="#e0e0e0"/><text x="214" y="521" font-size="11">Pendiente</text>
    <rect x="284" y="508" width="82" height="18" rx="9" fill="#d0d0d0"/><text x="292" y="521" font-size="11">🔒 Importada</text>
    <text x="378" y="521" font-size="12" fill="#777">📅 4 nov 2026   TSK-A-000012</text>
    <text x="1006" y="507">🗑</text>
  </g>

  <!-- Notas -->
  <g font-size="12" fill="#b00">
    <text x="150" y="580">① Vista inicial: lista con estado de cada tarea y botones de crear, importar, marcar terminadas y vaciar.</text>
    <text x="150" y="600">② Buscador por título o ID + filtro por estado con contadores.</text>
    <text x="150" y="620">③ Importadas: sin botón editar, check deshabilitado y etiqueta "Importada". Solo se pueden eliminar.</text>
    <text x="150" y="640">④ Eliminar y vaciar piden confirmación. Avisos breves (toast) abajo a la derecha.</text>
  </g>
</svg>
